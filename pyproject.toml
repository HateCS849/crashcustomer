[project]
name = "crashcustomer"
version = "0.1.0"
description = "Goal-driven browser testing with evidence and independent replay"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.0,<3",
  "playwright>=1.49,<2",
  "langgraph>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "mcp>=1.2,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crashcustomer*"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
